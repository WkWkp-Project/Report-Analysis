name: Verify

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and audit frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Compose configuration
        env:
          APP_AUTH_PASSWORD: ci-password-long-enough
          APP_SESSION_SECRET: ci-session-secret-that-is-longer-than-32-characters
          TOKEN_ENCRYPTION_KEY: ci-encryption-key-that-is-longer-than-32-characters
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag report-analysis:verify .
